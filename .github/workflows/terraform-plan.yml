name: Terraform plan

# Pull requests that touch infra/: show what would change. Read-only identity (github-planner), `-refresh=false`
# (config vs state), no apply from CI. Apply is run by the owner from a workstation (see docs/deploy.md).

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    # Fork PRs get no OIDC token and no repository variables.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_billing_account_id: ${{ vars.BILLING_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PLAN }}
          service_account: ${{ vars.PLAN_SA }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - name: Plan
        run: terraform plan -input=false -no-color -refresh=false -lock-timeout=60s -out=tfplan > plan.txt 2>&1 || { cat plan.txt; exit 1; }
      - name: Comment plan on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('infra/plan.txt', 'utf8');
            const max = 60000;
            if (body.length > max) body = body.slice(0, max) + '\n... truncated, see the workflow log';
            const marker = '<!-- terraform-plan -->';
            const comment = `${marker}\n### Terraform plan (config vs state, no refresh)\n\n\`\`\`\n${body}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = (await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number }))
              .find((c) => c.body && c.body.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: comment });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body: comment });
